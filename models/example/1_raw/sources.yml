version: 2

sources:
  - name: raw
    schema: raw
    description: "append-only product crawling landing data"
    tables:
      - name: product_crawling
        description: "raw records ingested from the crawler pipeline"
        loaded_at_field: "to_timestamp(crawl_timestamp, 'YYYY-MM-DD HH24:MI')"
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 72
              period: hour